name: tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Checar sintaxe de todos os .lua
        run: |
          fail=0
          while IFS= read -r f; do
            if ! lua5.4 -e "assert(loadfile('$f'))" 2>/tmp/syntax.err; then
              echo "SINTAXE: $f"; cat /tmp/syntax.err; fail=1
            fi
          done < <(git ls-files '*.lua')
          exit $fail

      - name: Rodar specs
        run: |
          # Falhas pré-existentes no main (não causadas por PRs). Remover daqui ao corrigir.
          KNOWN_FAILING="tests/exec_permissions_extended.lua tests/exec_permissions_spec.lua tests/permissions_ui_modal_spec.lua"
          fail=0
          for t in tests/*.lua; do
            log="/tmp/$(basename "$t").log"
            if timeout 300 lua5.4 "$t" > "$log" 2>&1; then
              echo "PASS  $t"
            elif echo " $KNOWN_FAILING " | grep -q " $t "; then
              echo "KNOWN $t (falha pré-existente)"
            else
              echo "FAIL  $t"; tail -30 "$log"; fail=1
            fi
          done
          exit $fail
